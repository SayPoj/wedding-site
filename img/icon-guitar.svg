<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <defs>
    <filter id="rough" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough)" fill="none" stroke="#FF6B8A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- guitar body -->
    <circle cx="34" cy="38" r="14" fill="#FFF5E6" fill-opacity="0.2"/>
    <circle cx="26" cy="36" r="10" fill="#FFF5E6" fill-opacity="0.15"/>
    <!-- sound hole -->
    <circle cx="30" cy="37" r="4" stroke="#F5B700" stroke-width="2"/>
    <!-- neck -->
    <rect x="27" y="6" width="6" height="20" rx="2"/>
    <!-- head -->
    <rect x="25" y="4" width="10" height="6" rx="2" stroke="#F5B700" stroke-width="2"/>
    <!-- strings -->
    <line x1="29" y1="10" x2="28" y2="48" stroke="#F5B700" stroke-width="1" opacity="0.5"/>
    <line x1="31" y1="10" x2="32" y2="48" stroke="#F5B700" stroke-width="1" opacity="0.5"/>
    <!-- tuning pegs -->
    <circle cx="24" cy="5" r="1.5" fill="#FF8FAB"/>
    <circle cx="24" cy="8" r="1.5" fill="#FF8FAB"/>
    <circle cx="36" cy="5" r="1.5" fill="#FF8FAB"/>
    <circle cx="36" cy="8" r="1.5" fill="#FF8FAB"/>
    <!-- music notes -->
    <circle cx="46" cy="18" r="4" fill="#F5B700" opacity="0.4"/>
    <line x1="49" y1="15" x2="49" y2="8" stroke="#F5B700" stroke-width="1.5" opacity="0.4"/>
    <circle cx="52" cy="12" r="3" fill="#F5B700" opacity="0.25"/>
    <line x1="54" y1="10" x2="54" y2="4" stroke="#F5B700" stroke-width="1.5" opacity="0.25"/>
  </g>
</svg>