<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50">
  <defs>
    <filter id="rough" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough)">
    <!-- veil body - translucent layers -->
    <path d="M40,5 Q55,15 62,35 Q60,38 55,40 Q50,42 40,42 Q30,42 25,40 Q20,38 18,35 Q25,15 40,5Z" 
          fill="#FFF" opacity="0.55" stroke="#FFD1DC" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M40,10 Q52,18 57,32 Q55,35 50,36 Q45,37 40,37 Q35,37 30,36 Q25,35 23,32 Q28,18 40,10Z" 
          fill="#FFF" opacity="0.4" stroke="none"/>
    <!-- lace edge dots -->
    <circle cx="28" cy="32" r="1.5" fill="#FFD1DC" opacity="0.4"/>
    <circle cx="33" cy="36" r="1.5" fill="#FFD1DC" opacity="0.4"/>
    <circle cx="40" cy="37" r="1.5" fill="#FFD1DC" opacity="0.4"/>
    <circle cx="47" cy="36" r="1.5" fill="#FFD1DC" opacity="0.4"/>
    <circle cx="52" cy="32" r="1.5" fill="#FFD1DC" opacity="0.4"/>
    <!-- small flower on top -->
    <circle cx="40" cy="8" r="4" fill="#FFD1DC" opacity="0.6"/>
    <circle cx="40" cy="8" r="2.5" fill="#FFF" opacity="0.5"/>
    <circle cx="40" cy="8" r="1" fill="#FFD1DC"/>
  </g>
</svg>