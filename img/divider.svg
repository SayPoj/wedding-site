<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 24" width="240" height="24">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough)">
    <path d="M0,12 Q20,4 40,12 Q60,20 80,12 Q100,4 120,12 Q140,20 160,12 Q180,4 200,12 Q220,20 240,12" 
          fill="none" stroke="#FF6B8A" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <!-- small decorative dots -->
    <circle cx="60" cy="20" r="3.5" fill="#F5B700"/>
    <circle cx="120" cy="12" r="3.5" fill="#F5B700"/>
    <circle cx="180" cy="4" r="3.5" fill="#F5B700"/>
  </g>
</svg>