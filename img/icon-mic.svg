<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <defs>
    <filter id="rough" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough)" fill="none" stroke="#FF6B8A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- mic body -->
    <rect x="24" y="20" width="12" height="18" rx="6" fill="#FF6B8A" fill-opacity="0.15"/>
    <!-- mic head -->
    <ellipse cx="30" cy="18" rx="10" ry="8" stroke="#FF6B8A" stroke-width="2.5"/>
    <ellipse cx="30" cy="18" rx="6" ry="5" fill="#FF6B8A" fill-opacity="0.08"/>
    <!-- mic grid lines -->
    <line x1="21" y1="15" x2="25" y2="15" stroke="#FF8FAB" stroke-width="1" opacity="0.4"/>
    <line x1="21" y1="18" x2="25" y2="18" stroke="#FF8FAB" stroke-width="1" opacity="0.4"/>
    <line x1="21" y1="21" x2="25" y2="21" stroke="#FF8FAB" stroke-width="1" opacity="0.4"/>
    <!-- stand -->
    <line x1="30" y1="38" x2="30" y2="52" stroke="#FF6B8A" stroke-width="2"/>
    <line x1="20" y1="52" x2="40" y2="52" stroke="#F5B700" stroke-width="2.5"/>
    <!-- sound waves -->
    <path d="M44,14 Q48,18 44,22" stroke="#F5B700" stroke-width="1.5" opacity="0.5"/>
    <path d="M48,10 Q54,18 48,26" stroke="#F5B700" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>