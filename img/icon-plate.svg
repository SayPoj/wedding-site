<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <defs>
    <filter id="rough" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough)" fill="none" stroke="#F5B700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- plate -->
    <ellipse cx="30" cy="38" rx="22" ry="12" fill="#FFF5E6" stroke="#F5B700" opacity="0.8"/>
    <ellipse cx="30" cy="38" rx="16" ry="8" stroke="#FFD54F" stroke-width="1.5" opacity="0.5"/>
    <!-- fork (left) -->
    <path d="M20,20 L20,48" stroke="#FF6B8A"/>
    <path d="M17,12 L17,20"/>
    <path d="M20,12 L20,20"/>
    <path d="M23,12 L23,20"/>
    <!-- knife (right) -->
    <path d="M40,20 L40,48" stroke="#FF6B8A"/>
    <path d="M43,12 Q45,16 43,20 L40,18" stroke="#FF6B8A" fill="#FF6B8A" fill-opacity="0.3"/>
  </g>
</svg>