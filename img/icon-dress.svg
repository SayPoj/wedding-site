<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <defs>
    <filter id="rough" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough)" fill="none" stroke="#FF6B8A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- dress body -->
    <path d="M30,8 Q34,14 34,20 L38,48 L22,48 L26,20 Q26,14 30,8Z" fill="#FFD1DC" fill-opacity="0.2"/>
    <!-- neckline -->
    <path d="M26,16 Q28,14 30,16 Q32,14 34,16" stroke="#FF6B8A" stroke-width="2"/>
    <!-- waist -->
    <path d="M24,28 Q30,30 36,28" stroke="#F5B700" stroke-width="1.5" opacity="0.6"/>
    <!-- decorative bow at bottom -->
    <path d="M28,44 Q25,42 23,44" stroke="#F5B700" stroke-width="1.5"/>
    <path d="M32,44 Q35,42 37,44" stroke="#F5B700" stroke-width="1.5"/>
    <!-- sparkle dots -->
    <circle cx="20" cy="12" r="1.5" fill="#F5B700" opacity="0.4"/>
    <circle cx="40" cy="10" r="1.5" fill="#F5B700" opacity="0.4"/>
    <circle cx="42" cy="18" r="1" fill="#F5B700" opacity="0.3"/>
  </g>
</svg>